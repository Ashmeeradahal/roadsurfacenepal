<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road Surface Nepal Flights</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.7.1/dist/css/tabulator.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --ink: #18181b; --muted: #71717a; --line: #e7e5e4; --hover: #f4f4f2;
  --good: #15803d; --good-bg: #ecfdf3; --warn: #b45309; --warn-bg: #fff7ed; --poor: #dc2626; --poor-bg: #fef2f2; --aside: #9ca3af;
  font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
.page { max-width: 1680px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 18px; font-weight: 600; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.left { display: grid; gap: 14px; min-width: 0; }
.right { display: grid; gap: 10px; position: sticky; top: 16px; min-width: 0; }
section { display: grid; gap: 14px; min-width: 0; }

#summary { margin: 14px 0 22px; display: grid; gap: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat { padding: 12px 16px; min-width: 170px; }
.stat b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.Good b { color: var(--good); } .stat.Poor b { color: var(--warn); } .stat.Rejected b { color: var(--poor); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days span { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.days b { color: var(--ink); font-weight: 600; }

.pill { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.Good { color: var(--good); background: var(--good-bg); } .pill.Poor { color: var(--warn); background: var(--warn-bg); } .pill.Rejected { color: var(--poor); background: var(--poor-bg); }
.bad { color: var(--poor); font-weight: 600; }

.sitehead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
/* Tabulator, restyled to the page */
#flights.tabulator { border: 1px solid var(--line); border-radius: 10px; background: var(--card); font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; }
#flights .tabulator-header { background: var(--card); border-bottom: 1px solid var(--line); color: var(--muted); }
#flights .tabulator-header .tabulator-col { background: var(--card); border-right: 0; }
#flights .tabulator-col-title { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
#flights .tabulator-col .tabulator-col-content { padding: 6px 8px; }
#flights .tabulator-header-filter input, #flights .tabulator-header-filter select { font: inherit; font-size: 12px; text-transform: none; letter-spacing: 0; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
#flights .tabulator-tableholder { background: var(--card); }
#flights .tabulator-row { background: var(--card); border-bottom: 1px solid var(--line); cursor: pointer; }
#flights .tabulator-row.tabulator-row-even { background: var(--card); }
#flights .tabulator-row:hover { background: var(--hover); }
#flights .tabulator-row.tabulator-selected { background: var(--hover); box-shadow: inset 3px 0 0 var(--ink); }
#flights .tabulator-cell { border-right: 0; padding: 7px 8px; }
#flights .tabulator-footer { background: var(--card); border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; color: var(--muted); }
#flights .tabulator-page { border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
#flights .tabulator-page.active { background: var(--ink); color: var(--card); }
.num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 600; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }

.mapwrap { position: relative; overflow: hidden; }
#map { height: calc(100vh - 80px); min-height: 420px; }
#map .leaflet-tile-pane { filter: grayscale(0.85) brightness(1.06) contrast(0.85); }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 500; display: flex; gap: 12px; font-size: 12px; color: var(--muted);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.legend .gap { background: var(--poor); } .legend .aside { background: var(--aside); }

#detail { padding: 16px 18px; display: grid; gap: 10px; }
#detail .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#detail .meta { color: var(--muted); font-size: 12px; }
#detail .reason { margin: 0; font-size: 15px; }
.oambadge { margin-left: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--good); background: var(--good-bg); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; text-decoration: none; }
.oam { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.oam img { width: 120px; max-width: 100%; height: 120px; object-fit: contain; border-radius: 4px; background: var(--hover); }
.oam a { color: var(--ink); }
.telenote { margin: 0; font-size: 13px; color: var(--warn); background: var(--warn-bg); border: 1px solid #fed7aa; border-radius: 8px; padding: 7px 12px; }
#summary .telenote { justify-self: start; }
.tele { margin-left: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; }
.checks li.head { display: block; border: 0; padding: 0; color: var(--muted); font-size: 13px; }
.checks .state { font-size: 11px; font-weight: 600; text-align: center; border-radius: 999px; padding: 2px 0; }
.checks .pass .state { color: var(--good); background: var(--good-bg); } .checks .fail .state { color: var(--poor); background: var(--poor-bg); } .checks .wait .state { color: var(--muted); background: var(--hover); }
.checks .fail { border-color: #fecaca; }
.checks .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.checks .fail .val { color: var(--poor); font-weight: 600; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.facts .wide { grid-column: span 2; }
.facts dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.chip { font: 12px ui-monospace, "IBM Plex Mono", monospace; background: var(--hover); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
.leaflet-div-icon { background: none; border: 0; }
@media (max-width: 760px) {
  .page { padding: 16px; }
  h1 { font-size: 19px; text-wrap: balance; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { min-width: 0; padding: 10px 12px; }
  .stat b { font-size: 20px; }
  .stat span { font-size: 12px; display: block; line-height: 1.3; }
  main { grid-template-columns: 1fr; }
  .right { position: static; order: -1; }
  #map { height: 340px; min-height: 0; }
  #detail { padding: 14px; }
  #flights .tabulator-cell { padding: 7px 8px; }
  .checks li { grid-template-columns: 48px 1fr; gap: 2px 8px; padding: 7px 10px; }
  .checks .val { grid-column: 2; }
}
  </style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="heading">Road surface Nepal flights</h1>
    <div id="summary"></div>
  </header>
  <main>
    <div class="left">
      <div id="flights"></div>
      <div id="detail" class="card" hidden></div>
    </div>
    <div class="right">
      <div class="sitehead"><h2 id="title"></h2></div>
      <div class="mapwrap card"><div id="map"></div>
        <div class="legend"><span><i class="gap"></i>gap</span><span><i class="aside"></i>set aside</span></div></div>
    </div>
  </main>
</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/tabulator-tables@6.7.1/dist/js/tabulator.min.js"></script>
  <script>
const COLORS = ["#2563eb", "#ea580c", "#7c3aed", "#0891b2", "#db2777", "#65a30d"];
// Rule limits: a value outside them is shown in red.
const LIMITS = { gimbal: 80, overlap: 70, height: 75, smallGaps: 2 };
const has = v => v !== undefined && v !== null && v !== "";
const gapsOk = q => Number(q.gaps) <= LIMITS.smallGaps && Number(q.big_gaps || 0) === 0;
const tele = q => Number(q.focal_35mm) >= 50;
const isFlight = q => Number(q.images) >= 10; // smaller sets are stray photos, not flights
const OAM_BROWSE = id => `https://imagery.hotosm.org/browse?selected_id=${id}`;
const OAM_TILES = id => `https://api.imagery.hotosm.org/raster/collections/openaerialmap/items/${id}/tiles/WebMercatorQuad/{z}/{x}/{y}.png?assets=visual`;
const $ = id => document.getElementById(id);
const text = (el, value) => { el.textContent = value; return el; };
const pill = v => `<span class="pill ${v}">${v}</span>`;
const day = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

const map = L.map("map", { preferCanvas: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 22,
  maxNativeZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
// Published orthophotos sit above the greyed base map and below the flight points.
map.createPane("oam").style.zIndex = 250;
let layer = L.layerGroup().addTo(map);
let allPoints = [];

// One line per rule: state is "pass", "fail" or "wait" (not known yet).
function checklist(q, list) {
  const pitch = has(q.pitch_deg_median) ? Math.abs(Number(q.pitch_deg_median)) : null;
  const tilted = Number(q.tilted_photos || 0);
  const dngOnly = /DNG/.test(q.reason);
  const rows = [
    ["Camera pointing down (gimbal 80 to 90°)",
      pitch === null ? "wait" : pitch >= LIMITS.gimbal && Number(q.pitch_spread90_deg || 0) <= 5 ? "pass" : "fail",
      pitch === null ? "" : `${pitch}°` + (tilted ? `, ${tilted} tilted photo${tilted > 1 ? "s" : ""} left out` : "")],
    ["Overlap 70% or more",
      has(q.forward_overlap_median) ? (Number(q.forward_overlap_median) >= LIMITS.overlap ? "pass" : "fail") : "fail",
      has(q.forward_overlap_median) ? `${q.forward_overlap_median}%` : "not a mapping flight"],
    ["At most 2 small gaps between photos",
      has(q.gaps) ? (gapsOk(q) ? "pass" : "fail") : "fail",
      has(q.gaps) ? `${q.gaps} gap${Number(q.gaps) === 1 ? "" : "s"}` + (Number(q.big_gaps) ? `, ${q.big_gaps} with no shared ground` : "") : "not a mapping flight"],
    ["Height about 70 m (75 m at most)",
      has(q.height_m_max) ? (Math.round(Number(q.height_m_max)) <= LIMITS.height ? "pass" : "fail") : "wait",
      has(q.height_m_max) ? `${Math.round(q.height_m_max)} m` : ""],
    ["JPG photos", dngOnly ? "fail" : "pass", dngOnly ? "DNG only" : ""],
    ["Main 28 mm camera",
      has(q.focal_35mm) ? (tele(q) ? "fail" : "pass") : "wait",
      has(q.focal_35mm) ? `${q.focal_35mm} mm` : ""],
  ];
  const passed = rows.filter(r => r[1] === "pass").length;
  list.append(text(Object.assign(document.createElement("li"), { className: "head" }),
    passed === rows.length ? "All checks pass: this flight goes to processing." : `${passed} of ${rows.length} checks pass. All must pass for the flight to be processed.`));
  const mark = { pass: "Pass", fail: "Fix", wait: "Pending" };
  rows.forEach(([label, state, value]) => {
    const li = Object.assign(document.createElement("li"), { className: state });
    li.append(text(Object.assign(document.createElement("span"), { className: "state" }), mark[state]),
      text(document.createElement("span"), label),
      text(Object.assign(document.createElement("span"), { className: "val" }), value));
    list.append(li);
  });
}

function summarise(flights) {
  const count = (list, v) => list.filter(q => q.status === v).length;
  const byDay = new Map();
  flights.forEach(q => byDay.set(q.start.slice(0, 10), [...(byDay.get(q.start.slice(0, 10)) || []), q]));
  const stat = (v, label, note) => `<div class="stat card ${v}"><b>${count(flights, v)}</b><span>${label} · ${note}</span></div>`;
  $("summary").innerHTML =
    `<div class="stats">${stat("Good", "accepted", `of ${flights.length} flights`)}${stat("Poor", "poor", "fly again with corrections")}${stat("Rejected", "rejected", "fly again")}</div>` +
    `<p class="telenote">${flights.filter(tele).length} of ${flights.length} flights used the 70 mm telephoto camera. Their orthophotos come out distorted, so they are rejected.</p>` +
    `<div class="days">${[...byDay].map(([d, qs]) => `<span><b>${day(d)}</b> ${count(qs, "Good")} of ${qs.length} good</span>`).join("")}</div>`;
}

// A number cell, red when outside the rule limit.
const numCol = (title, field, unit, isBad) => ({
  title, field, hozAlign: "right", headerHozAlign: "right", sorter: "number", width: 88,
  formatter: cell => {
    const v = cell.getValue();
    if (!has(v)) return "–";
    if (isBad(v, cell.getRow().getData())) cell.getElement().classList.add("bad");
    return `${v}${unit}`;
  },
});

fetch("data.json").then(r => r.json()).then(data => {
  const flights = data.sites.flatMap(site => site.qa.filter(isFlight).map(q => ({
    ...q,
    site,
    label: site.label,
    gimbal: has(q.pitch_deg_median) ? Math.abs(Number(q.pitch_deg_median)) : "",
    height: has(q.height_m_max) ? Math.round(Number(q.height_m_max)) : "",
    overlap: has(q.forward_overlap_median) ? Number(q.forward_overlap_median) : "",
    gapcount: has(q.gaps) ? Number(q.gaps) : "",
  })));
  allPoints = data.points;
  const days = flights.map(q => q.start).sort();
  const fmt = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  text($("heading"), `Road surface Nepal flights, ${fmt(days[0])} to ${fmt(days[days.length - 1])}`);
  summarise(flights);

  const table = new Tabulator("#flights", {
    data: flights,
    index: "flight",
    layout: "fitColumns",
    pagination: true,
    paginationSize: 15,
    selectableRows: 1,
    initialSort: [{ column: "start", dir: "asc" }],
    columns: [
      { title: "Flight", field: "flight", sorter: "number", width: 86,
        formatter: cell => `${cell.getValue()}${tele(cell.getRow().getData()) ? '<span class="tele" title="70 mm telephoto camera">tele</span>' : ""}` },
      { title: "Site", field: "label", minWidth: 130, headerFilter: "input", headerFilterPlaceholder: "Filter sites" },
      { title: "Date", field: "start", width: 108, formatter: cell => `${day(cell.getValue())}, ${cell.getValue().slice(11, 16)}` },
      { title: "Status", field: "status", width: 104, formatter: cell => pill(cell.getValue()),
        headerFilter: "list", headerFilterParams: { values: ["Good", "Poor", "Rejected"], clearable: true }, headerFilterPlaceholder: "All" },
      numCol("Gimbal", "gimbal", "°", v => v < LIMITS.gimbal),
      numCol("Height", "height", " m", v => v > LIMITS.height),
      { ...numCol("Overlap", "overlap", "%", v => v < LIMITS.overlap), width: 100 },
      numCol("Gaps", "gapcount", "", (v, q) => !gapsOk(q)),
      { title: "OAM", field: "oam", width: 76, headerSort: false,
        formatter: cell => (cell.getValue() || []).map(o => `<a class="oambadge" href="${OAM_BROWSE(o.id)}" target="_blank" rel="noopener">OAM</a>`).join(""),
        headerFilter: "list", headerFilterParams: { values: { yes: "On OAM", no: "Not on OAM" }, clearable: true }, headerFilterPlaceholder: "All",
        headerFilterFunc: (want, oam) => (want === "yes") === Boolean(oam && oam.length) },
    ],
  });
  table.on("rowClick", (e, row) => { if (!e.target.closest("a")) showFlight(row.getData()); });
  table.on("tableBuilt", () => {
    const first = flights[0];
    table.selectRow(first.flight);
    showFlight(first);
  });
});

let drawn = null;
const flightColor = new Map();

// Draw every flight of a site, with its published orthophotos underneath.
function drawSite(site) {
  drawn = site;
  map.removeLayer(layer);
  layer = L.layerGroup().addTo(map);
  const sitePoints = allPoints.filter(p => p.s === site.site);
  site.qa.slice().sort((a, b) => a.start.localeCompare(b.start)).forEach((q, k) => flightColor.set(Number(q.flight), COLORS[k % COLORS.length]));
  new Set(site.qa.flatMap(q => (q.oam || []).map(o => o.id))).forEach(id =>
    L.tileLayer(OAM_TILES(id), { pane: "oam", maxZoom: 22, attribution: '<a href="https://openaerialmap.org">OpenAerialMap</a>' }).addTo(layer));
  drawSite.groups = new Map();
  site.qa.forEach(q => {
    const f = Number(q.flight);
    const color = flightColor.get(f);
    const g = L.layerGroup().addTo(layer);
    const shots = sitePoints.filter(p => p.f === f);
    const mapping = shots.filter(p => p.k === "m");
    if (mapping.length > 1) L.polyline(mapping.map(p => [p.la, p.lo]), { color, weight: 2, opacity: 0.6 }).addTo(g);
    shots.forEach(p => {
      const aside = p.k !== "m";
      L.circleMarker([p.la, p.lo], { radius: aside ? 3 : 4, color: aside ? "#9ca3af" : color, fillOpacity: 0.9, weight: 1 })
        .bindTooltip(`${p.n} ${p.t}<br>${p.h ?? ""} m, ${p.p !== undefined ? Math.abs(p.p) : ""}°, ${p.g ?? ""} cm/px` +
          (p.ov !== undefined ? `, overlap ${p.ov}%` : "") + (aside ? "<br>set aside" : ""))
        .addTo(g);
    });
    site.gaps.filter(x => x.flight === f).forEach(x =>
      L.polyline([x.a, x.b], { color: "#dc2626", weight: 5 }).bindTooltip(has(x.ties) ? `gap: ${x.ties} tie points` : `gap: ${x.ov}% overlap`).addTo(g));
    if (shots.length) {
      L.marker([shots[0].la, shots[0].lo], {
        icon: L.divIcon({ html: `<span class="num" style="background:${color}">${f}</span>`, iconSize: [24, 24], iconAnchor: [12, 28] }),
      }).addTo(g);
    }
    drawSite.groups.set(f, g);
  });
  if (sitePoints.length) map.fitBounds(L.latLngBounds(sitePoints.map(p => [p.la, p.lo])), { padding: [30, 30] });
}

function showFlight(q) {
  const f = Number(q.flight);
  if (drawn !== q.site) drawSite(q.site);
  text($("title"), `${q.label}, flight ${f}`);
  drawSite.groups.forEach((g, key) => g.eachLayer(l => l.setStyle?.({ opacity: key === f ? 1 : 0.15, fillOpacity: key === f ? 0.9 : 0.1 })));
  const color = flightColor.get(f);
  const detail = $("detail");
  detail.hidden = false;
  detail.innerHTML = `<div class="head"><span class="num" style="background:${color}">${f}</span><b>Flight ${f}</b>${pill(q.status)}<span class="meta"></span></div>` +
    `<p class="reason"></p>${tele(q) ? `<p class="telenote">Rejected: taken with the 70 mm telephoto camera, which gives a distorted orthophoto. Fly again with the main 28 mm camera (select it in DJI Fly before starting the waypoint flight).</p>` : ""}` +
    `<div class="oams"></div><ul class="checks"></ul><dl class="facts"></dl>`;
  text(detail.querySelector(".meta"), `${q.start.slice(0, 10)}, ${q.start.slice(11, 16)} to ${q.end.slice(11, 16)}`);
  text(detail.querySelector(".reason"), q.reason);
  (q.oam || []).forEach(o => {
    const box = Object.assign(document.createElement("p"), { className: "oam" });
    const link = () => Object.assign(document.createElement("a"), { href: OAM_BROWSE(o.id), target: "_blank", rel: "noopener" });
    const thumb = link();
    thumb.append(Object.assign(document.createElement("img"), { src: o.thumb, alt: `Orthophoto ${o.title}`, loading: "lazy" }));
    box.append(thumb, text(link(), `Processed: ${o.title} on OpenAerialMap`));
    detail.querySelector(".oams").append(box);
  });
  const facts = detail.querySelector(".facts");
  const fact = (label, ...values) => {
    const box = document.createElement("div");
    if (label === "Folder") box.className = "wide";
    const dd = document.createElement("dd");
    dd.append(...values);
    box.append(text(document.createElement("dt"), label), dd);
    facts.append(box);
  };
  q.folders.split("; ").forEach(entry => {
    const [, name, count] = entry.match(/^(.*) \((\d+)\)$/);
    fact("Folder", text(Object.assign(document.createElement("code"), { className: "chip" }), name), ` ${count} photos`);
  });
  fact("Drone", q.drone);
  fact("Camera", `${q.focal_35mm} mm${tele(q) ? " telephoto" : ""}`);
  fact("Photos used", `${q.mapping} of ${q.images}`);
  if (q.gsd_cm_median) fact("Ground resolution", `${q.gsd_cm_median} cm/px`);
  checklist(q, detail.querySelector(".checks"));
}
  </script>
</body>
</html>
